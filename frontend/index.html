<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Makhija Quantum AI | Future-Ready. User-Friendly.</title>
    <meta name="description"
        content="We build future-ready, user-friendly AI tools and systems that quietly remove friction from everyday work. No hype. No complexity." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#F0F9FF',
                            100: '#E0F2FE',
                            200: '#BAE6FD',
                            300: '#7DD3FC',
                            400: '#38BDF8',
                            500: '#0EA5E9',
                            600: '#0284C7',
                            700: '#0369A1',
                            800: '#075985',
                            900: '#0C4A6E', // Deep Navy
                            950: '#020617', // Midnight (Dark Mode Bg)
                            accent: '#6366F1', // Indigo/Violet
                            secondary: '#0EA5E9', // Sky Blue
                            soft: '#F8FAFC', // Off-white
                            surface: '#1E293B', // Dark mode card surface
                        }
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                        'hero-glow': 'conic-gradient(from 180deg at 50% 50%, #6366F1 0deg, #0EA5E9 180deg, #6366F1 360deg)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }

        .dark ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Premium Card Hover Effect */
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
        }

        .dark .card-hover:hover {
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
        }

        /* Button Glow Effect */
        .btn-glow {
            position: relative;
            overflow: hidden;
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, #6366f1, #0ea5e9, #6366f1);
            border-radius: inherit;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
            filter: blur(8px);
        }

        .btn-glow:hover::before {
            opacity: 0.6;
        }

        /* Smooth Image Reveal */
        .img-reveal {
            clip-path: inset(0 100% 0 0);
            animation: revealImage 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes revealImage {
            to {
                clip-path: inset(0 0 0 0);
            }
        }

        /* Gradient Text Animation */
        .gradient-text-animate {
            background-size: 200% auto;
            animation: gradientFlow 3s ease infinite;
        }

        @keyframes gradientFlow {

            0%,
            100% {
                background-position: 0% center;
            }

            50% {
                background-position: 100% center;
            }
        }

        /* Floating Animation */
        .float {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Shine Effect on Hover */
        .shine-hover {
            position: relative;
            overflow: hidden;
        }

        .shine-hover::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
                    transparent 30%,
                    rgba(255, 255, 255, 0.1) 50%,
                    transparent 70%);
            transform: translateX(-100%) rotate(45deg);
            transition: transform 0.6s ease;
        }

        .shine-hover:hover::after {
            transform: translateX(100%) rotate(45deg);
        }

        /* Smooth Section Fade In */
        .fade-in-section {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fade-in-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Icon Pulse */
        .icon-pulse:hover svg {
            animation: iconPulse 0.5s ease;
        }

        @keyframes iconPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        /* Text Reveal Animation */
        .text-reveal {
            overflow: hidden;
        }

        .text-reveal span {
            display: inline-block;
            animation: textReveal 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(100%);
        }

        @keyframes textReveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Smooth Focus States */
        input:focus,
        textarea:focus,
        button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        /* Link Underline Animation */
        .link-underline {
            position: relative;
        }

        .link-underline::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: currentColor;
            transition: width 0.3s ease;
        }

        .link-underline:hover::after {
            width: 100%;
        }
    </style>
</head>

<body
    class="bg-brand-soft text-brand-900 selection:bg-brand-accent selection:text-white dark:bg-brand-950 dark:text-gray-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>

</html>
